name: Bug report
description: Something behaved incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not use this form for security defects.** Report those privately - see
        [SECURITY.md](https://github.com/ithealthtech/CallBridge/blob/main/SECURITY.md).

        **Never include real telephone numbers, call detail records, recordings, contact
        data, ConnectWise identifiers, or production settings.** Use synthetic `555`
        numbers and `example.invalid` domains.

  - type: input
    id: version
    attributes:
      label: CallBridge version
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 Pro 24H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Desktop application (UI)
        - SIP registration or signaling
        - Call audio / media
        - Local service or launcher
        - ConnectWise integration
        - Call history, export, or retention
        - White-label configuration
        - Build or tests
    validations:
      required: true

  - type: dropdown
    id: launch
    attributes:
      label: How was it started?
      options:
        - Start-CallBridge.ps1
        - Installed build
        - Built from source
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      description: Redact numbers, contact data, and identifiers before pasting.
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is not a security defect.
          required: true
        - label: I have removed real telephone numbers, customer data, and credentials.
          required: true
